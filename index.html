<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>wusefentai</title>
    <link rel="stylesheet" href="index.css">
    <style>
       /* ========== 全局基础 ========== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ========== 页面主体 ========== */
body {
    display: flex;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-image: url('f.jpg');
    background-size: cover;          /* 手机默认填满屏幕 */
    background-repeat: no-repeat;
    background-position: center center;
    background-color: #000;          /* 电脑 contain 时左右留白显示为黑色 */
    transition: background-image 0.5s ease-in-out;
}

/* ========== 标题文字 ========== */
body h1 {
    width: 100%;
    text-align: center;
    color: pink;
    z-index: 1;
    position: relative;
    user-select: none;
}

/* ========== 底部小点 ========== */
.dots {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 2;
    user-select: none;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.5);
    cursor: pointer;
    transition: background-color 0.3s, transform 0.3s;
}

.dot.active {
    background-color: #fff;
    transform: scale(1.3);
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
}

/* ========== 电脑宽屏时完整显示图片 ========== */
/* 方式一：根据屏幕宽度判断（≥768px 视为电脑/平板横屏） */
@media (min-width: 768px) {
    body {
        background-size: contain;    /* 完整显示，不裁剪 */
    }
}

/* 方式二：根据宽高比判断（宽 > 高 时使用 contain） */
/* 如果只想保留一种，推荐删除下面这一段或上面的 @media (min-width: 768px) */
@media (min-aspect-ratio: 1/1) {
    body {
        background-size: contain;
    }
}
    </style>
</head>
<body>
<h1>人生天地间，忽如远行客。</h1>
<div class="dots" id="dots"></div>

<script>
    // 背景图片数组（新增了第三张图片）
    const backgroundImages = [
        'f.jpg',
        '0ac1c4bd5b7e165ac0a8ca861a7c37bc.jpg',
        '20260813190758_339_3.jpg'
    ];
    
    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;
    let isDragging = false;
    let mouseStartX = 0;

    const dotsContainer = document.getElementById('dots');

    // 初始化小点
    function initDots() {
        backgroundImages.forEach((img, index) => {
            const dot = document.createElement('span');
            dot.className = 'dot' + (index === currentIndex ? ' active' : '');
            dot.dataset.index = index;
            dot.addEventListener('click', () => {
                setCurrentIndex(index);
            });
            dotsContainer.appendChild(dot);
        });
    }

    // 切换图片并更新小点状态
    function setCurrentIndex(index) {
        currentIndex = index;
        document.body.style.backgroundImage = `url('${backgroundImages[currentIndex]}')`;
        updateDots();
    }

    function updateDots() {
        const dots = dotsContainer.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            if (index === currentIndex) {
                dot.classList.add('active');
            } else {
                dot.classList.remove('active');
            }
        });
    }

    // 监听触摸开始事件
    document.body.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    });
    
    // 监听触摸结束事件
    document.body.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    });
    
    // 处理滑动逻辑
    function handleSwipe() {
        const swipeThreshold = 50;
        
        if (touchEndX < touchStartX - swipeThreshold) {
            // 向左滑动，下一张
            setCurrentIndex((currentIndex + 1) % backgroundImages.length);
        } else if (touchEndX > touchStartX + swipeThreshold) {
            // 向右滑动，上一张
            setCurrentIndex((currentIndex - 1 + backgroundImages.length) % backgroundImages.length);
        }
    }
    
    // 为桌面设备添加鼠标拖动事件
    document.body.addEventListener('mousedown', (e) => {
        // 如果点击的是小点，不触发拖动切换
        if (e.target.closest('.dots')) return;
        isDragging = true;
        mouseStartX = e.screenX;
    });
    
    document.body.addEventListener('mouseup', (e) => {
        if (!isDragging) return;
        touchEndX = e.screenX;
        touchStartX = mouseStartX;
        handleSwipe();
        isDragging = false;
    });

    // 初始化
    initDots();
</script>
</body>
</html>
